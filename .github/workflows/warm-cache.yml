# 缓存预热 —— **全仓库唯一的缓存写入者**，且**只手动触发**（workflow_dispatch）。
# tests.yml / release.yml 一律 restore-only。GitHub 缓存按触发 ref 分域，让各工作流
# 各写各的只会堆出没人回读的重复条目（tag 上写入的尤其如此）；集中到一处写。
# **覆盖语义**：GitHub 缓存 key 不可变（同键已存在的 save 会被拒），所以每次保存前先按 key
# 删掉旧条目（`gh api DELETE .../actions/caches?key=`），再 save —— 这才真正「新覆盖旧」。
# 依赖升级（Cargo.lock / Cargo.toml / versions.env 变更）后，从默认分支手动 dispatch
# 一次本工作流暖桶，之后的分支/ tag 都能回读。
# warm 用「冷构建 target」（不恢复 target 缓存）→ 保存的快照始终干净、无历史增量垃圾。
name: 缓存预热（手动）

on:
  workflow_dispatch:

env:
  # linuxdeploy / appimagetool 需要 FUSE；CI 容器里没有，用解包运行模式。
  APPIMAGE_EXTRACT_AND_RUN: "1"
  # 中文输出需要 UTF-8（Windows runner 的默认代码页是 cp1252），见 tests.yml 同处注释。
  PYTHONIOENCODING: utf-8

jobs:
  warm:
    name: 预热 · ${{ matrix.os }}（唯一缓存写入者）
    runs-on: ${{ matrix.os }}
    permissions:
      actions: write # 删旧缓存（GitHub 缓存 key 不可变，覆盖 = 先删再存）
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # 全部 bash（原来是 pwsh，见 tests.yml 同处注释）。Windows runner 上 bash 由 Git 自带。
      - name: Load versions + cache keys (versions.env 是唯一来源)
        shell: bash
        run: |
          # **必须 source，不能只写 GITHUB_ENV**：写进 $GITHUB_ENV 的变量要到**后续 step**
          # 才注入进程环境，而缓存键就在这一步里拼 —— 只写不 source 的话 $CACHE_GEN /
          # $LINUX_CACHE_TAG / $TCLI_VER 全是空串，拼出来的键是残的（实测出现过
          # `purevox-Linux--cargo--<hash>`：恢复必然不命中，随后 cargo install 撞上
          # runner 镜像自带的 cargo-tauri 直接 exit 101）。
          set -a
          . tools/automation/versions.env
          set +a
          # 再写进 GITHUB_ENV，供后续 step 使用
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              ''|'#'*) continue ;;
              *=*) printf '%s\n' "$line" >> "$GITHUB_ENV" ;;
            esac
          done < tools/automation/versions.env
          # 缓存键 = 发行版 + 缓存代数 + Cargo.lock 哈希。唯一写入者是 warm-cache.yml。
          # **发行版段不能省**：target/ 里是各发行版自己编出来的 C 依赖产物
          # （ort-sys / aws-lc-sys / ring），跨发行版回读就是用错中间产物；
          # `ubuntu-24.04` 还在无人察觉地从 24.04 迁到 26.04。取值来自 versions.env 的
          # LINUX_CACHE_TAG，不在 runner 上探测 —— 探测不到会静默退化成同一个键，
          # 不同版本又混回一起，等于白加这一段（见 AGENTS §2.7 缓存纪律）。
          lock="${{ hashFiles('src-tauri/Cargo.lock') }}"
          case "$RUNNER_OS" in
            Windows) os_tag="windows" ;;
            *)       os_tag="$LINUX_CACHE_TAG" ;;
          esac
          {
            printf 'CARGO_CACHE_KEY=purevox-%s-%s-cargo-%s-%s\n' "$RUNNER_OS" "$os_tag" "$CACHE_GEN" "$lock"
            printf 'TARGET_DEBUG_KEY=purevox-%s-%s-target-dbg-%s-%s\n' "$RUNNER_OS" "$os_tag" "$CACHE_GEN" "$lock"
            printf 'TAURI_CLI_KEY=purevox-%s-tauri-cli-%s\n' "$RUNNER_OS" "$TCLI_VER"
          } >> "$GITHUB_ENV"

      # Tauri wry 运行时 (WebKitGTK 4.1) + cpal (ALSA) + 打 rpm 需要 rpmbuild。
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libssl-dev libxdo-dev librsvg2-dev libgtk-3-dev libasound2-dev \
            libopus0 pkg-config file rpm

      - name: Install Rust toolchain (rustfmt + clippy)
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"

      - name: Restore cargo registry (restore-only)
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ env.CARGO_CACHE_KEY }}

      - name: Restore cargo-tauri binary (restore-only)
        uses: actions/cache/restore@v6
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: ${{ env.TAURI_CLI_KEY }}

      - name: Install tauri-cli（仅在缺失时编译，版本钉死）
        shell: bash
        run: |
          # 判据是「盘上有没有」，不是 cache-hit 输出 —— runner 镜像可能已预装 cargo-tauri，
          # 那时 cache-hit 是 false 但二进制已在，`cargo install` 会撞
          # "binary already exists in destination"。command -v 判断天然幂等。
          if command -v cargo-tauri >/dev/null 2>&1; then
            echo "cargo-tauri 已存在（缓存或镜像预装），跳过安装"
          else
            cargo install tauri-cli --version "$TCLI_VER" --locked
          fi

      # 冷构建 debug（不恢复 target 缓存）：clippy/build/test 覆盖 target/debug 全部工件。
      - name: Warm debug (clippy + build + test)
        shell: bash
        run: |
          python tools/automation/check.py -Gate clippy
          python tools/automation/check.py -Gate build
          python tools/automation/check.py -Gate test

      # 只预热 debug 目标（+ registry + tauri-cli）：release 目标不预热（release.yml 需要时自己冷编）。
      - name: Drop stale caches（同键先删，保证新缓存覆盖旧的）
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub 缓存 key 不可变：同键已存在时 save 会被拒（旧的永远留着）。先按 key 删掉旧的。
          for k in "$CARGO_CACHE_KEY" "$TARGET_DEBUG_KEY" "$TAURI_CLI_KEY"; do
            [ -n "$k" ] || continue
            gh api --method DELETE "repos/${{ github.repository }}/actions/caches?key=$k" >/dev/null 2>&1 || true
            echo "drop $k"
          done

      - name: Save cargo registry
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ env.CARGO_CACHE_KEY }}

      - name: Save target/debug
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: src-tauri/target/debug
          key: ${{ env.TARGET_DEBUG_KEY }}

      - name: Save cargo-tauri binary
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: ${{ env.TAURI_CLI_KEY }}
