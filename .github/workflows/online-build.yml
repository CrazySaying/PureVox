# 在线编译 · 出可安装成品（推送触发）—— 推分支就在 GitHub 上打包，Actions 页面直接下载。
#
# 与另外两份工作流的分工（**别混用**）：
#   - `tests.yml`：只跑门禁、只手动触发（上游纪律：日常提交零成本）。
#   - `release.yml`：tag `v*` 触发，打包 + **建 GitHub Release**（正式发版）。
#   - **本文件**：push 就触发，打包到 **Actions artifact**，不建 Release、不动 tag。
#     用途：没有本地 Rust 环境，也想拿到「下载就能装」的成品。
#
# 产物形态与 release.yml **完全一致**（同一套 `cargo tauri build` + `assert_bundle.py`），
# 所以这里下来的包跟正式发版的是同一种东西，只是挂在 workflow run 上而不是 Release 页面。
#
# 纪律与其他两份一致：
#   - 门禁实现只有一处 `tools/automation/check.py`；版本与缓存键只来自 `versions.env`；
#   - 缓存只 restore（写入者是 `warm-cache.yml`）——这里**不写 cache/save**；
#   - `legacy-v*/` 快照不参与（AGENTS.md 维护准则 3）。
name: 在线编译（推送触发，出安装包）

on:
  push:
    branches:
      # 只在本仓库的开发分支上跑：避免每次提交都烧 runner 时间。
      - main
      - tauri-port
    # 纯文档与快照的改动不值得编一遍（会白烧十几分钟）。
    paths-ignore:
      - "legacy-v**"
      - "**.md"
      - ".opencode/**"
  workflow_dispatch:

# 同一分支连推时取消上一轮（半成品包没有价值）。
concurrency:
  group: online-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # linuxdeploy / appimagetool 需要 FUSE；CI 容器里没有，用解包运行模式。
  APPIMAGE_EXTRACT_AND_RUN: "1"
  # 脚本大量打中文；Windows runner 的 Python 默认按控制台代码页（cp1252）输出，
  # 一句 `print("门禁全部通过")` 就是 UnicodeEncodeError。脚本内部也会 reconfigure，这里是双保险。
  PYTHONIOENCODING: utf-8

jobs:
  # ------------------------------------------------------------ Windows 安装包
  windows:
    name: 打包 · Windows（NSIS 安装包）
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # 版本号门禁要**先跑**：它内部的 `Gate · version` 会用 4 个假 tag 反复跑
      # version.py，并在 finally 里删掉 `.build-version.json`（防止假日期污染真实构建）。
      # 放在 `Set app version` 之后就会把真文件删掉 → `cargo tauri build --config`
      # 报 `No such file or directory`（本工作流第一版就这么挂的）。
      - name: "Gate · version"
        shell: bash
        run: python tools/automation/check.py -Gate version

      # 版本号 = 年.月.日（version.py 是唯一实现），同时生成 .build-version.json
      # 供 `cargo tauri build --config` 覆盖 tauri.conf.json 里的 version。
      - name: Set app version（tag / 日期）
        shell: bash
        run: python tools/automation/version.py >> "$GITHUB_ENV"

      - name: Load versions + cache keys (versions.env 是唯一来源)
        shell: bash
        run: |
          # **必须 source，不能只写 GITHUB_ENV**：写进 GITHUB_ENV 的变量要到后续 step
          # 才注入进程环境，而缓存键就在这一步里拼 —— 只写不 source 的话键是残的。
          set -a
          . tools/automation/versions.env
          set +a
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              ''|'#'*) continue ;;
              *=*) printf '%s\n' "$line" >> "$GITHUB_ENV" ;;
            esac
          done < tools/automation/versions.env
          lock="${{ hashFiles('src-tauri/Cargo.lock') }}"
          {
            printf 'CARGO_CACHE_KEY=purevox-%s-windows-cargo-%s-%s\n' "$RUNNER_OS" "$CACHE_GEN" "$lock"
            printf 'TARGET_DEBUG_KEY=purevox-%s-windows-target-dbg-%s-%s\n' "$RUNNER_OS" "$CACHE_GEN" "$lock"
            printf 'TARGET_RELEASE_KEY=purevox-%s-windows-target-rel-%s-%s-%s\n' "$RUNNER_OS" "$CACHE_GEN" "$TCLI_VER" "$lock"
            printf 'TAURI_CLI_KEY=purevox-%s-tauri-cli-%s\n' "$RUNNER_OS" "$TCLI_VER"
          } >> "$GITHUB_ENV"
          echo "CARGO_CACHE_KEY=$CARGO_CACHE_KEY"

      - name: Install Rust toolchain (rustfmt + clippy)
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version

      # restore 一律不写 restore-keys（精确命中是唯一路径，理由见 tests.yml）
      - name: Restore cargo registry (restore-only)
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ env.CARGO_CACHE_KEY }}

      - name: Restore target/debug (restore-only)
        uses: actions/cache/restore@v6
        with:
          path: src-tauri/target/debug
          key: ${{ env.TARGET_DEBUG_KEY }}

      # 打包前先过门禁：**发出去的包必须先是绿的**。顺序与 release.yml 一致。
      - name: "Gate · fmt"
        shell: bash
        run: python tools/automation/check.py -Gate fmt

      - name: "Gate · clippy"
        shell: bash
        run: python tools/automation/check.py -Gate clippy

      - name: "Gate · build"
        shell: bash
        run: python tools/automation/check.py -Gate build

      - name: "Gate · test"
        shell: bash
        run: python tools/automation/check.py -Gate test

      # UI 门禁（含 i18n）：Hush 节点的 label 属于用户可见串，漏译会在这里红。
      # release.yml 在 Windows 上也跑它，这里保持一致。
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VER }}

      - name: "Gate · ui (tsc + i18n_lint)"
        shell: bash
        run: |
          npm install -g "typescript@$TS_VER"
          python tools/automation/check.py -Gate ui

      # 注意：`Gate · version` 已在 job 最前面跑过（它会删掉 .build-version.json），
      # 这里不能再跑，否则又把真版本文件删掉、打包时找不到配置。
      - name: "Gate · bundle"
        shell: bash
        run: python tools/automation/check.py -Gate bundle

      # tauri-cli 是打包机（只用来跑 `cargo tauri build`）。缓存里通常已有；
      # 判据是「盘上有没有」而不是 cache-hit —— runner 镜像可能已预装。
      - name: Restore cargo-tauri binary (restore-only)
        uses: actions/cache/restore@v6
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: ${{ env.TAURI_CLI_KEY }}

      - name: Install tauri-cli（仅在缺失时编译，版本钉死）
        shell: bash
        run: |
          if command -v cargo-tauri >/dev/null 2>&1; then
            echo "cargo-tauri 已存在（缓存或镜像预装），跳过安装"
          else
            cargo install tauri-cli --version "$TCLI_VER" --locked
          fi

      - name: Build installers (cargo tauri build)
        working-directory: src-tauri
        shell: bash
        run: cargo tauri build --config .build-version.json

      # 断言产物的**布局与启动**：模型是否齐全（含 models/hush/ 的四个图）、
      # 可执行文件是否落位、起得来。这条与 release.yml 是同一份脚本。
      - name: Assert bundle layout + startup smoke
        shell: bash
        run: python tools/automation/assert_bundle.py --smoke

      # 一个格式一个 artifact（artifact 下载永远是 zip，改不了）。Windows 只有 NSIS 一种。
      - name: Upload NSIS installer
        uses: actions/upload-artifact@v7
        with:
          name: PureVox-Windows-x64-${{ env.STAMP }}-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # -------------------------------------------------------------- Linux 安装包
  linux:
    name: 打包 · Linux（deb + rpm + AppImage）
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # 与 Windows job 同一条理由：version 门禁会删掉 `.build-version.json`，
      # 必须排在 `Set app version` **之前**（它会跑 4 个假 tag 并在 finally 里清理）。
      - name: "Gate · version"
        shell: bash
        run: python tools/automation/check.py -Gate version

      - name: Set app version（tag / 日期）
        shell: bash
        run: python tools/automation/version.py >> "$GITHUB_ENV"

      - name: Load versions + cache keys (versions.env 是唯一来源)
        shell: bash
        run: |
          set -a
          . tools/automation/versions.env
          set +a
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              ''|'#'*) continue ;;
              *=*) printf '%s\n' "$line" >> "$GITHUB_ENV" ;;
            esac
          done < tools/automation/versions.env
          lock="${{ hashFiles('src-tauri/Cargo.lock') }}"
          {
            printf 'CARGO_CACHE_KEY=purevox-%s-%s-cargo-%s-%s\n' "$RUNNER_OS" "$LINUX_CACHE_TAG" "$CACHE_GEN" "$lock"
            printf 'TARGET_DEBUG_KEY=purevox-%s-%s-target-dbg-%s-%s\n' "$RUNNER_OS" "$LINUX_CACHE_TAG" "$CACHE_GEN" "$lock"
            printf 'TARGET_RELEASE_KEY=purevox-%s-%s-target-rel-%s-%s-%s\n' "$RUNNER_OS" "$LINUX_CACHE_TAG" "$CACHE_GEN" "$TCLI_VER" "$lock"
            printf 'TAURI_CLI_KEY=purevox-%s-tauri-cli-%s\n' "$RUNNER_OS" "$TCLI_VER"
          } >> "$GITHUB_ENV"
          echo "CARGO_CACHE_KEY=$CARGO_CACHE_KEY"

      # Tauri wry 运行时 (WebKitGTK 4.1) + cpal (ALSA) + 打 rpm 需要 rpmbuild。
      - name: Install Linux system deps
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libssl-dev libxdo-dev librsvg2-dev libgtk-3-dev libasound2-dev \
            libopus0 xvfb pkg-config file rpm

      - name: Install Rust toolchain (rustfmt + clippy)
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"

      - name: Restore cargo registry (restore-only)
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ env.CARGO_CACHE_KEY }}

      - name: Restore target/debug (restore-only)
        uses: actions/cache/restore@v6
        with:
          path: src-tauri/target/debug
          key: ${{ env.TARGET_DEBUG_KEY }}

      - name: "Gate · fmt"
        shell: bash
        run: python tools/automation/check.py -Gate fmt

      - name: "Gate · clippy"
        shell: bash
        run: python tools/automation/check.py -Gate clippy

      - name: "Gate · build"
        shell: bash
        run: python tools/automation/check.py -Gate build

      - name: "Gate · test"
        shell: bash
        run: python tools/automation/check.py -Gate test

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VER }}

      - name: "Gate · ui (tsc + i18n_lint)"
        shell: bash
        run: |
          npm install -g "typescript@$TS_VER"
          python tools/automation/check.py -Gate ui

      # 同上：version 门禁已在 job 最前面跑过，别在这里再删一次版本文件。
      - name: Restore cargo-tauri binary (restore-only)
        uses: actions/cache/restore@v6
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: ${{ env.TAURI_CLI_KEY }}

      - name: Install tauri-cli（仅在缺失时编译，版本钉死）
        shell: bash
        run: |
          if command -v cargo-tauri >/dev/null 2>&1; then
            echo "cargo-tauri 已存在（缓存或镜像预装），跳过安装"
          else
            cargo install tauri-cli --version "$TCLI_VER" --locked
          fi

      - name: Build installers (cargo tauri build)
        working-directory: src-tauri
        shell: bash
        run: cargo tauri build --config .build-version.json

      - name: Assert bundle layout + smoke (deb)
        shell: bash
        run: python tools/automation/assert_bundle.py --smoke

      # 一个格式一个 artifact，理由同 Windows（AppImage 单它 ~200 MB）。
      - name: Upload deb
        uses: actions/upload-artifact@v7
        with:
          name: PureVox-Linux-x64-${{ env.VERSION }}-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Upload rpm
        uses: actions/upload-artifact@v7
        with:
          name: PureVox-Linux-x64-${{ env.VERSION }}-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: PureVox-Linux-x64-${{ env.VERSION }}-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # ------------------------------------------------------------ 界面门禁（单独）
  ui:
    name: 界面检查（tsc + i18n）
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Load versions (versions.env 是唯一来源)
        shell: bash
        run: |
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              ''|'#'*) continue ;;
              *=*) printf '%s\n' "$line" >> "$GITHUB_ENV" ;;
            esac
          done < tools/automation/versions.env

      # 本仓库无 package.json，不设 setup-node 的 cache（缓存只由 warm-cache.yml 写）。
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VER }}

      - name: Install TypeScript (版本钉死在 versions.env)
        shell: bash
        run: npm install -g "typescript@$TS_VER"

      - name: "Gate · ui (tsc + i18n_lint)"
        shell: bash
        run: python tools/automation/check.py -Gate ui
