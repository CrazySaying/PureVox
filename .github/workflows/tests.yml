# 测试（门禁）—— **只测试，不打包**，且**只手动触发**（Actions → 测试 → Run workflow）。
# 分支推送 / PR **不触发**：日常提交零成本，要验证某分支手动 dispatch 一次即可。
# 打包与发版见 release.yml（tag `v*` 触发，也可手动）。
# 纪律（沿袭旧版）：
#   - 缓存全部 restore-only，唯一写入者是 warm-cache.yml（也手动）；
#   - 键与版本的唯一来源是 tools/automation/versions.env（本文件只组合，不硬编码版本）；
#   - 门禁实现只有一处 tools/automation/check.py（Python，跨平台唯一实现）；
#   - legacy-v*/ 快照不参与 CI（AGENTS.md 维护准则 3）。
name: 测试（只跑门禁，手动触发）

on:
  workflow_dispatch:

jobs:
  rust:
    name: 测试 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # 下面所有 step 都是 bash（原来整份用 pwsh，是「门禁脚本是 PowerShell」的历史包袱；
      # 换成 check.py 之后就没有理由再依赖 pwsh 了）。Windows runner 上 bash 由 Git 自带。
      - name: Load versions + cache keys (versions.env 是唯一来源)
        shell: bash
        run: |
          # versions.env 是 KEY=VALUE，一行行喂给 GITHUB_ENV
          # （原来这段是 PowerShell 的 Get-Content | Where-Object | ForEach-Object）。
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              ''|'#'*) continue ;;
              *=*) printf '%s\n' "$line" >> "$GITHUB_ENV" ;;
            esac
          done < tools/automation/versions.env
          # 缓存键 = 缓存代数 + Cargo.lock 哈希。唯一写入者是 warm-cache.yml。
          lock="${{ hashFiles('src-tauri/Cargo.lock') }}"
          {
            printf 'CARGO_CACHE_KEY=purevox-%s-cargo-%s-%s\n' "$RUNNER_OS" "$CACHE_GEN" "$lock"
            printf 'TARGET_DEBUG_KEY=purevox-%s-target-dbg-%s-%s\n' "$RUNNER_OS" "$CACHE_GEN" "$lock"
          } >> "$GITHUB_ENV"

      # cpal 在 Linux 上要 ALSA 开发头（pkg-config 名字 `alsa`）；WebKitGTK 4.1 是 Tauri wry 运行时必需。
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libssl-dev libxdo-dev librsvg2-dev libgtk-3-dev libasound2-dev \
            libopus0 pkg-config file

      - name: Install Rust toolchain (rustfmt + clippy)
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version

      - name: Restore cargo registry (restore-only)
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ env.CARGO_CACHE_KEY }}
          restore-keys: |
            purevox-${{ runner.os }}-cargo-${{ env.CACHE_GEN }}-

      - name: Restore target/debug (restore-only)
        uses: actions/cache/restore@v6
        with:
          path: src-tauri/target/debug
          key: ${{ env.TARGET_DEBUG_KEY }}
          restore-keys: |
            purevox-${{ runner.os }}-target-dbg-${{ env.CACHE_GEN }}-

      - name: "Gate · fmt"
        shell: bash
        run: python tools/automation/check.py -Gate fmt

      - name: "Gate · clippy"
        shell: bash
        run: python tools/automation/check.py -Gate clippy

      - name: "Gate · build"
        shell: bash
        run: python tools/automation/check.py -Gate build

      - name: "Gate · test"
        shell: bash
        run: python tools/automation/check.py -Gate test

      # 版本号推导：version.py 是**唯一实现**（Windows / Linux 同一条命令）。
      # 两个平台都跑，各自校验本平台的 Python 能把它跑通、且对同一批 tag 产出固定的值 ——
      # 版本推导错了，表现是包名/文件名里的日期不对，要等用户装上才发现。
      - name: "Gate · version"
        shell: bash
        run: python tools/automation/check.py -Gate version

  ui:
    name: 界面检查（tsc + i18n）
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Load versions (versions.env 是唯一来源)
        shell: bash
        run: |
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              ''|'#'*) continue ;;
              *=*) printf '%s\n' "$line" >> "$GITHUB_ENV" ;;
            esac
          done < tools/automation/versions.env

      # 本仓库无 package.json，不设 setup-node 的 cache（缓存只由 warm-cache.yml 写）。
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VER }}

      - name: Install TypeScript (版本钉死在 versions.env)
        shell: bash
        run: npm install -g "typescript@$TS_VER"

      - name: "Gate · ui (tsc + i18n_lint)"
        shell: bash
        run: python tools/automation/check.py -Gate ui
